name: Publish site

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26

      # CV PDFs (Typst, bundled with Quarto) are built from data/cv.yml first,
      # so the website links to fresh copies
      - name: Render CV PDFs and site
        run: make site

      - name: Check CV PDFs were published
        run: |
          test -s _site/assets/cv/cv-academic.pdf
          test -s _site/assets/cv/cv-industry.pdf

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  # Only main is published; dev and pull requests just check that the site builds
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
