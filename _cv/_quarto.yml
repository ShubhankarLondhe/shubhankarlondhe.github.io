# Separate Quarto project for the PDF CVs, so the website render ignores it.
# Build with `make cv` from the repository root (see Makefile).
# Produces one CV, aimed at industry positions and kept ATS-friendly:
# single column, real text, standard headings, no images or icons.
project:
  type: default

format:
  typst:
    papersize: a4
    margin:
      x: 1.6cm
      y: 1.4cm
    mainfont: "Libertinus Serif"
    fontsize: 11pt
    keep-typ: true
    include-in-header: cv-style.typ
    output-file: Shubhankar_Londhe_CV.pdf

shortcodes:
  - cv.lua
