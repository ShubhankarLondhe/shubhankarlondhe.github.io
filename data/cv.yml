summary: >-
  Computational biologist (PhD candidate, TUM and Helmholtz Munich) working on
  rare-variant effects in complex traits and disease. Hands-on experience with
  patient-level genetic data on the UK Biobank RAP, All of Us Researcher
  Workbench and Genomics England Research Environment, and with training and
  evaluating machine learning models in PyTorch.

