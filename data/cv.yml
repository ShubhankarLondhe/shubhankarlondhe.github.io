summary: >-
  Computational biologist (PhD, TUM and Helmholtz Munich) building methods and
  benchmarks for rare-variant effects in human disease. Experienced with
  patient-level genetic data on the UK Biobank RAP, All of Us Researcher
  Workbench and Genomics England Research Environment, and with machine
  learning in PyTorch.

