summary: >-
  Computational biologist (PhD, TU Munich and Helmholtz Munich) developing machine learning and statistical methods for variant effect prediction, rare-variant gene discovery, and rare-disease diagnostics, using data from the UK Biobank, All of Us, Genomics England, and Solve-RD. Experienced in training and evaluating machine learning models, and in building scalable workflows for biobank-scale data.

# Work history, shown as "Experience" in the PDF. Bullets restate facts from
# the education, publications, skills and teaching entries below.
experience:
  - title: "Doctoral Researcher"
    lead: "Prof. Julien Gagneur"
    org: "Technical University of Munich & Helmholtz Munich"
    location: "Munich, Germany"
    start: "10.2022"
    end: "Present"
    details:
      - "Built UKBBGym, a benchmark of variant scoring methods against phenotypes of ultra-rare variant carriers (first author, under review) · [Preprint](https://www.biorxiv.org/content/10.64898/2026.10.01.755962v1) · [Code](https://github.com/gagneurlab/ukbbgym)"
      - "Developed FuncRVP, which uses functional gene embeddings to improve gene discovery (first author) · [Preprint](https://www.biorxiv.org/content/10.1101/2024.07.22.604535v3) · [Code](https://github.com/gagneurlab/funcRVP)"
      - "Built applets and workflows converting UK Biobank whole-genome sequencing and phenotype data to ML-ready formats · [Code](https://github.com/gagneurlab/ukbb-utils-gagneur)"
      - "Rare-disease diagnostics: co-developed a causal gene-prioritization model for the CAGI7 challenge; participated in two Solve-RD Solvathons · [Paper](https://doi.org/10.1038/s41588-025-02290-3)"
      - "Mentoring junior PhD students; supervised 5 Master's theses and multiple interns"
  - title: "Visiting Researcher"
    lead: "Dr. Hilary Finucane and Dr. Konrad Karczewski"
    org: "Broad Institute of MIT and Harvard"
    location: "Cambridge, USA"
    start: "06.2026"
    end: "08.2026"
    details:
      - "Extended the UKBBGym benchmark to the All of Us biobank"

